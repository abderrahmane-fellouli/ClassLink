# =============================================================================
# ClassLink 1.0 — Blueprint Render (API Laravel 12)
# -----------------------------------------------------------------------------
# Usage :
#   1. Pousser le depot sur GitHub.
#   2. Render > New > Blueprint > selectionner ce fichier.
#   3. Renseigner les variables `sync: false` (marquees `REQUIRED`) dans le
#      tableau de bord Render. AUCUNE valeur sensible n'est versionnee ici.
#
# Documentation complete : docs/DEPLOYMENT.md
# =============================================================================

services:
  # Single paid, always-on runtime owns web, database worker and scheduler.
  # External managed PostgreSQL must be provisioned by an operator.
  - type: web
    name: classlink-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g # Always-on runtime; paid, not a zero-cost claim.
    numInstances: 1
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    healthCheckPath: /ready
    # Production preflight requires private S3; no ephemeral local uploads.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false # REQUIRED — ex. https://classlink-api.onrender.com
      - key: FRONTEND_URL
        sync: false # REQUIRED — ex. https://classlink.vercel.app (liste separee par des virgules)
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_KEY
        sync: false # php artisan key:generate --show; must decode to 32 bytes
      - key: DIGEST_TOKEN
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      # Direct managed PostgreSQL endpoint, not an expiring free database.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # §16 / NF-13 : l'API est derriere le proxy de Render. Sans cette
      # declaration, `Request::ip()` renvoie l'adresse interne du proxy pour
      # toutes les requetes : le journal d'audit ne trace plus le client reel
      # et les quotas bases sur l'IP deviennent globaux. Restreindre a une
      # plage precise si le service est expose directement sur Internet.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: APP_TIMEZONE
        value: UTC
      - key: SESSION_LIFETIME
        value: "480"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "960"
      - key: FILESYSTEM_DISK
        value: s3
      - key: MAIL_MAILER
        sync: false # REQUIRED — smtp (Brevo) ou log
      - key: MAIL_FROM_ADDRESS
        sync: false # REQUIRED — ex. no-reply@classlink.ma
      - key: MAIL_FROM_NAME
        value: ClassLink
      - key: MAIL_HOST
        sync: false # REQUIRED si smtp — smtp-relay.brevo.com
      - key: MAIL_PORT
        sync: false # 587
      - key: MAIL_USERNAME
        sync: false # REQUIRED si smtp
      - key: MAIL_PASSWORD
        sync: false # REQUIRED si smtp — cle SMTP Brevo
      - key: MAIL_ENCRYPTION
        sync: false # tls
      - key: AZURE_CLIENT_ID
        sync: false # REQUIRED pour la connexion Microsoft
      - key: AZURE_CLIENT_SECRET
        sync: false # REQUIRED pour la connexion Microsoft
      - key: AZURE_TENANT_ID
        sync: false # REQUIRED pour la connexion Microsoft
      - key: AZURE_REDIRECT_URI
        sync: false # REQUIRED — <APP_URL>/api/auth/microsoft/callback
      - key: AWS_ACCESS_KEY_ID
        sync: false # REQUIRED si s3
      - key: AWS_SECRET_ACCESS_KEY
        sync: false # REQUIRED si s3
      - key: AWS_DEFAULT_REGION
        sync: false # ex. eu-west-3
      - key: AWS_BUCKET
        sync: false # REQUIRED si s3 — seau PRIVE
      - key: AWS_ENDPOINT
        sync: false # S3-compatible HTTPS endpoint; blank for AWS
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      # Plafond du seau en octets : 9 Gio = 9 * 1024^3. Au-dela, l'API
      # refuse les envois (HTTP 507) avant toute ecriture. A baisser si le
      # forfait R2 est plus petit que 9 Gio.
      - key: CLASSLINK_STORAGE_LIMIT_BYTES
        value: "9663676416"
      - key: AI_PROVIDER_1_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_PROVIDER_2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_PROVIDER_3_BASE_URL
        value: https://api.mistral.ai/v1
      # §15.2 — le nom est fixe en base (§15.2) ; seules les cles varient.
      # `AI_PROVIDER_1` = OpenAI, `AI_PROVIDER_2` = Groq,
      # `AI_PROVIDER_3` = Mistral (voir backend/config/services.php).
      - key: AI_PROVIDER_1_KEY
        sync: false # optionnel
      - key: AI_PROVIDER_1_MODEL
        value: gpt-4o-mini
      - key: AI_PROVIDER_2_KEY
        sync: false # optionnel
      - key: AI_PROVIDER_2_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_PROVIDER_3_KEY
        sync: false # optionnel
      - key: AI_PROVIDER_3_MODEL
        value: mistral-small-latest
      # Refus categorique de la connexion de developpement en production.
      - key: DEV_AUTH_ENABLED
        value: "false"
    # Migrations appliquees AVANT de deplacer le trafic vers la nouvelle image.
    # Review compatibility and back up before every migration.
    preDeployCommand: php artisan migrate --force
    # Aucune commande de demarrage : le `CMD` du Dockerfile lance le serveur.
    # Aucun `buildCommand` : Render ignore ce champ en runtime `docker`.
