[global]
error_log = /proc/self/fd/2
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
access.log = /proc/self/fd/2
; %r excludes the query string; never append %Q%q (OAuth codes/state).
access.format = "%R [%t] \"%m %r\" %s"
request_terminate_timeout = 120s
