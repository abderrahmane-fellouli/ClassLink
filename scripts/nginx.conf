# No user directive: master and workers inherit the container's www-data UID.
pid /app/storage/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # Do not log OAuth codes/state or other query-string credentials.
    log_format classlink_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent upstream=$upstream_status';
    access_log /dev/stdout classlink_safe;
    server_tokens off;
    client_body_temp_path /app/storage/nginx/client_body;
    proxy_temp_path /app/storage/nginx/proxy;
    fastcgi_temp_path /app/storage/nginx/fastcgi;
    uwsgi_temp_path /app/storage/nginx/uwsgi;
    scgi_temp_path /app/storage/nginx/scgi;
    server {
        listen 8000;
        root /app/public;
        index index.php;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
        }
        location = /ready {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/infra/operations.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass 127.0.0.1:9000;
            add_header Cache-Control no-store always;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
        location /storage/ { return 404; }
    }
}
