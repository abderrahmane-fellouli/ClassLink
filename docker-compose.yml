# Local development only. Generate backend/.env and APP_KEY first.
services:
  app:
    image: classlink-api:local
    build: .
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 16m
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY or use docker compose --env-file backend/.env}
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: classlink
      DB_USERNAME: classlink
      DB_PASSWORD: classlink_local_only
      DB_SSLMODE: disable
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 960
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    volumes:
      - classlink-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: classlink
      POSTGRES_USER: classlink
      POSTGRES_PASSWORD: classlink_local_only
    volumes:
      - classlink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classlink -d classlink"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  classlink-storage:
  classlink-db:
