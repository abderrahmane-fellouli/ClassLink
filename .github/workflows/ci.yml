name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classlink_test
          POSTGRES_USER: classlink
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U classlink -d classlink_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: '0123456789abcdef0123456789abcdef'
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'classlink_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: classlink
      DB_PASSWORD: ci-only
      DB_SSLMODE: disable
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      DEV_AUTH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, intl, zip, pcntl
          coverage: none
      - run: composer validate --strict --no-check-all
        working-directory: backend
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: find backend/app backend/config backend/database backend/routes backend/tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
        working-directory: .
        # PHP application syntax is also exercised by the suite and Docker build.
      - run: php artisan migrate --force
        if: matrix.database == 'pgsql'
        working-directory: backend
      - run: php artisan test --no-coverage
        working-directory: backend
      - run: php artisan schedule:list
        working-directory: backend
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: composer audit --locked --no-interaction
        working-directory: backend
      - run: npm audit --audit-level=high
        if: always()
        working-directory: frontend
      - run: npm audit --audit-level=high
        if: always()
        working-directory: scripts
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: scripts
      - run: npx playwright install --with-deps chromium firefox
        working-directory: scripts
      - run: npm run browser
        working-directory: scripts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: artifacts/browser
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_KEY: '0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: composer install --no-interaction --prefer-dist --no-scripts
        working-directory: backend
      - run: npm ci
        working-directory: scripts
      - run: npm test
        working-directory: scripts
      - run: node scripts/validate-schema.mjs
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
        env:
          APP_KEY: '0123456789abcdef0123456789abcdef'
      - run: |
          curl --fail http://127.0.0.1:8000/up
          curl --fail http://127.0.0.1:8000/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.env)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/storage/probe)" = 404
          docker compose exec -T app php infra/queue-probe.php
          sleep 5
          docker compose exec -T app php infra/operations.php health
          test "$(docker compose exec -T db psql -U classlink -d classlink -Atc 'select count(*) from jobs')" = 0
          docker compose exec -T app php artisan schedule:run
          docker compose exec -T app test ! -f /app/.env
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker compose exec -T db createdb -U classlink restore_test
          mkdir -p backups
          bash scripts/backup.sh
          dump=$(find backups -name '*.dump')
          PGDATABASE=restore_test RESTORE_CONFIRM=restore_test bash scripts/restore.sh "$dump"
          if PGDATABASE=restore_test RESTORE_CONFIRM=restore_test bash scripts/restore.sh "$dump"; then
            echo 'Restore safety guard failed'; exit 1
          fi
          source_count=$(docker compose exec -T db psql -U classlink -d classlink -Atc 'select count(*) from migrations')
          restored_count=$(docker compose exec -T db psql -U classlink -d restore_test -Atc 'select count(*) from migrations')
          test "$source_count" = "$restored_count"
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: classlink
          PGUSER: classlink
          PGPASSWORD: classlink_local_only
          PGSSLMODE: disable
          BACKUP_DIR: backups
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
